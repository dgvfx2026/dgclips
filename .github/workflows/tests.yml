name: DGCLIPS checks
on:
  push:
    branches: [main, master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: supoclip
          POSTGRES_USER: supoclip
          POSTGRES_PASSWORD: supoclip_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supoclip -d supoclip"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://supoclip:supoclip_test_password@127.0.0.1:5432/supoclip
      TEST_DATABASE_URL: postgresql+asyncpg://supoclip:supoclip_test_password@127.0.0.1:5432/supoclip
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      SELF_HOST: "true"
      BACKEND_AUTH_SECRET: dgclips_ci_backend_secret_not_for_production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: uv sync --frozen --all-groups
        working-directory: backend
      - run: .venv/bin/pytest
        working-directory: backend
  frontend:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SELF_HOST: "true"
      DGCLIPS_DEMO: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:studio
